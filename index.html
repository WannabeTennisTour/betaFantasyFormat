].map(a=>({n:a[0],g:a[1],t:a[2],p:a[3]}));
const R=T.map((_,i)=>S.filter(s=>s.t===i));
const MR={1:10000,2:7800,3:6085,5:4745,9:3320,17:1000,33:500,I:500},WR={...MR,9:2000,I:1000},MP={...MR,9:2500,I:1000},WP={...MR,9:2000,I:2000},MF={1:15000,2:11700,3:9125,5:7115,9:4980,17:3240,25:1500,33:750,I:750},WF={...MF,9:3000,17:1500,I:1500};

 if(fin){const top=t=>Math.max(...R[t].map(s=>pts(s,ev)||0));w=sa>sb?a:sb>sa?b:top(a)>=top(b)?a:b;l=w===a?b:a}
 return{a,b,sa,sb,w,l,label,ta,tb,fin}}

 for(let ev=1;ev<=upto;ev++)(M[ev]||[]).forEach(m=>{if(!m.fin)return;r[m.w].w++;r[m.l].l++;r[m.a].pf+=m.sa;r[m.b].pf+=m.sb});
 return r.sort((x,y)=>y.w-x.w||y.pf-x.pf)}

 for(let ev=1;ev<=9;ev++)M[ev]=pairs(ev<=7?ev-1:ev-8).map((p,i)=>mk(ev,p[0],p[1],'Matchup '+(i+1)));

 return`<div class="m ${open.has(k)?'open':''}" id="m${k}" ${can?`onclick="tg('${k}')"`:''}><div class="mh">${m.label}</div>${side(m,k,m.a,m.sa,m.ta)}${side(m,k,m.b,m.sb,m.tb)}${can?`<div class="det">${det(m.a,ev)}${det(m.b,ev)}</div><div class="tap">tap for surfer breakdown</div>`:''}</div>`}
function tg(k){open.has(k)?open.delete(k):open.add(k);$('#m'+k).classList.toggle('open')}
function evh(ev){const e=E[ev-1],s=stat(ev),pos=ev-1;
 const title=`<div class="past-title"><button class="past-arrow" aria-label="Previous event (older)" title="Previous event (older)" onclick="event.stopPropagation();moveEvent(-1)" ${pos===0?'disabled':''}>‹</button><h3>${e[1]}</h3><button class="past-arrow" aria-label="Next event (newer)" title="Next event (newer)" onclick="event.stopPropagation();moveEvent(1)" ${pos===E.length-1?'disabled':''}>›</button></div><p>${e[2]} · ${fmt(e[3])}–${fmt(e[4])}</p><small class="past-count">Event ${ev} of ${E.length}</small>`;
 return`<section class="ev"><div class="eh"><span class="n">${ev}</span><div>${title}</div><span class="pill ${s}">${s==='live'?'● LIVE':s==='final'?'Final':'Upcoming'}</span></div><div class="ph">${phase(ev)}</div>${M[ev].map((m,i)=>mc(m,ev,i)).join('')}</section>`}
function categoryFor(ev){const s=stat(ev);return s==='final'?'past':s==='live'?'current':'future'}
function moveEvent(delta){selectedEv=Math.max(1,Math.min(E.length,selectedEv+delta));sub=categoryFor(selectedEv);render();scrollTo(0,0)}
function selectSub(s){sub=s;if(s==='past'){const past=E.filter(e=>stat(e[0])==='final');selectedEv=past.length?past[past.length-1][0]:cur()}else if(s==='current')selectedEv=cur();else{const upcoming=E.find(e=>stat(e[0])==='upcoming');selectedEv=upcoming?upcoming[0]:E[E.length-1][0]}render();scrollTo(0,0)}
function viewEvents(){if(!selectedEv)selectedEv=cur();if(!E.some(e=>e[0]===selectedEv))selectedEv=cur();const ev=selectedEv;
 const ch=M[12][0];const champ=ch.fin?`<div class="champ">🏆 ${T[ch.w][1]} ${T[ch.w][0]} — 2026 Champions</div>`:'';
 return champ+evh(ev)}
function viewBoard(){const L=standings(12),seed=standings(9).map(x=>x.t);
 return`<p class="hd">Season record (all events incl. playoffs) · tiebreak: points for</p><div class="lb">${L.map((x,i)=>`<div class="lr"><span class="k">${i+1}</span><i class="em">${T[x.t][1]}</i><div><b>${T[x.t][0]}</b><small>Team ${x.t+1} · Reg. season seed #${seed.indexOf(x.t)+1} · ${x.pf.toLocaleString()} pts</small></div><div class="rec">${x.w}-${x.l}</div></div>`).join('')}</div>`}
function viewTeams(){return T.map((t,i)=>`<div class="tm"><div class="tt"><i class="em">${t[1]}</i><div><h3>${t[0]}</h3><small>Team ${i+1}</small></div></div>${R[i].map(s=>`<div class="pr">${av(s,44)}<div><b>${s.n}</b><small>${s.g==='m'?"Men's CT":"Women's CT"}</small></div><span>${E.reduce((a,e)=>a+(pts(s,e[0])||0),0).toLocaleString()}</span></div>`).join('')}</div>`).join('')}
function render(){build();const live=E.some(e=>stat(e[0])==='live');$('#lv').style.display=live?'inline-block':'none';
 $('#sub').style.display=tab==='events'?'flex':'none';
 if(tab==='events'&&selectedEv){sub=categoryFor(selectedEv)}
 $('#sub').innerHTML=['past','current','future'].map(s=>`<button class="${sub===s?'on':''}" onclick="selectSub('${s}')">${s[0].toUpperCase()+s.slice(1)}</button>`).join('');
 document.querySelectorAll('.bn button').forEach(b=>{const active=b.dataset.t===tab;b.classList.toggle('on',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 $('#app').innerHTML=tab==='events'?viewEvents():tab==='board'?viewBoard():viewTeams()}
async function poll(){try{const r=await fetch('results.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
 Object.assign(ST,j.status||{});
 for(const ev in j.placements||{})for(const n in j.placements[ev]){const s=S.find(x=>x.n===n);if(s)s.p[ev-1]=j.placements[ev][n]}
 render()}catch(e){}}
document.querySelectorAll('.bn button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
render();poll();setInterval(poll,60000);
</script>
</body>
</html>
